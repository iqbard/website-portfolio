# Netlify configuration: redirects and headers for Decap CMS admin

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200
  force = true

# Optional: set publish directory if different from default
# [build]
#   publish = "public"
