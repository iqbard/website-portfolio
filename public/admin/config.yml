# Decap CMS config for the Astro portfolio site
backend:
  name: github
  repo: iqbard/website-portfolio
  branch: main
  base_url: https://liburandirumah.vercel.app
  auth_endpoint: api/auth
  commit_messages:
    create: "Create {{collection}} "
    update: "Update {{collection}} "
    delete: "Delete {{collection}} "

local_backend:
  url: http://localhost:8081/api/v1

media_folder: "public/assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "work"
    label: "Work"
    folder: "src/content/work/nested"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Website Building"
          - "Paid Media"
          - "Ecommerce Management"
          - "Social Media"
          - "SEO & Content"
      - {label: "Publish Date", name: "publishDate", widget: "datetime"}
      - {label: "Image", name: "img", widget: "image", required: false}
      - {label: "Image alt", name: "img_alt", widget: "string", required: false}
      - {label: "Description", name: "description", widget: "text", required: false}
      - {label: "Tags", name: "tags", widget: "list", required: false}
      - label: "Highlights"
        name: "highlights"
        widget: "list"
        required: false
        collapsed: true
        fields:
          - {label: "Value", name: "value", widget: "string", hint: "The big number, e.g. IDR 501M or +130%"}
          - {label: "Label", name: "label", widget: "string", hint: "What the number measures, e.g. Total managed spend"}
          - {label: "Detail", name: "detail", widget: "string", required: false, hint: "Optional context line"}
      - {label: "Body", name: "body", widget: "markdown"}
  - name: "leads"
    label: "Leads"
    folder: "src/content/leads"
    create: false
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string", read_only: true}
      - {label: "Name", name: "name", widget: "string", read_only: true}
      - {label: "Email", name: "email", widget: "string", read_only: true}
      - {label: "Message", name: "message", widget: "text", read_only: true}
      - {label: "Created At", name: "createdAt", widget: "datetime", read_only: true}
      - label: "Status"
        name: "status"
        widget: "select"
        options:
          - "New"
          - "Contacted"
          - "Qualified"
          - "Closed"
